<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockchain & Git Hash Mining Simulator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #161b22;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 450px;
            border: 1px solid #30363d;
        }
        h2 {
            margin-top: 0;
            color: #58a6ff;
            text-align: center;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 5px;
            color: #c9d1d9;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
        }
        button:hover {
            background-color: #2ea043;
        }
        button:disabled {
            background-color: #21262d;
            color: #484f58;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            background-color: #0d1117;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #30363d;
        }
        .hash-box {
            font-family: monospace;
            background: #21262d;
            padding: 8px;
            border-radius: 4px;
            word-break: break-all;
            margin-top: 5px;
            color: #7ee787;
        }
        .short-hash {
            color: #ffa657;
            font-size: 1.2em;
            font-weight: bold;
        }
        .status {
            text-align: center;
            font-size: 0.9em;
            margin-bottom: 10px;
            color: #8b949e;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Mayning va Xesh Simulyatori</h2>
    <label for="commitMsg">Blokdagi Ma'lumot (Tranzaksiya):</label>
    <input type="text" id="commitMsg" value="Quvonchbek -> Ali: 50 BTC" placeholder="Ma'lumot kiriting...">
    
    <button id="mineBtn" onclick="startMining()">⛏️ Mayningni Boshlash (Qidirish)</button>

    <div class="result">
        <div id="statusText" class="status">Holat: Kutish rejimida</div>
        
        <div>Tekshirilayotgan Nonce (Omadli raqam):</div>
        <div id="nonceBox" class="hash-box" style="color: #d2a8ff;">0</div>

        <div style="margin-top: 10px;">Hosil bo'layotgan Xesh (Jonli):</div>
        <div id="fullHash" class="hash-box">-</div>
        
        <div style="margin-top: 10px;">Topilgan Qisqa Xesh (Short Hash):</div>
        <div id="shortHash" class="hash-box short-hash">-</div>
    </div>
</div>

<script>
// Kutish uchun yordamchi funksiya
const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

async function startMining() {
    const text = document.getElementById('commitMsg').value;
    const btn = document.getElementById('mineBtn');
    const statusText = document.getElementById('statusText');
    const nonceBox = document.getElementById('nonceBox');
    const fullHashBox = document.getElementById('fullHash');
    const shortHashBox = document.getElementById('shortHash');

    if (!text) {
        alert("Iltimos, ma'lumot kiriting!");
        return;
    }

    // Tugmani o'chirish
    btn.disabled = true;
    statusText.innerText = "⚡ Mayning ketmoqda: Nonce qidirilmoqda...";
    statusText.style.color = "#ffa657";

    let nonce = 1240;
    const totalSteps = 60; // Jami 60 ta qadam
    const delay = 100;     // Har bir qadam oralig'i 100ms (60 * 100ms = 6 soniya)

    const encoder = new TextEncoder();

    for (let i = 0; i < totalSteps; i++) {
        nonce += Math.floor(Math.random() * 800) + 121;
        nonceBox.innerText = nonce;

        // SHA-1 xeshni hisoblash
        const tempBuffer = await crypto.subtle.digest('SHA-1', encoder.encode(text + nonce));
        const tempArray = Array.from(new Uint8Array(tempBuffer));
        const tempHex = tempArray.map(b => b.toString(16).padStart(2, '0')).join('');
        
        fullHashBox.innerText = tempHex;
        shortHashBox.innerText = tempHex.substring(0, 7);

        // 100 millisekund kutish
        await sleep(delay);
    }

    // 6 soniya tugagach yakuniy holat
    statusText.innerText = "✅ Blok topildi! Xesh muvaffaqiyatli hisoblandi.";
    statusText.style.color = "#3fb950";
    btn.disabled = false;
}
</script>

</body>
</html>
